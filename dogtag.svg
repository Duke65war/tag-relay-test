<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Dog tags">
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a8b07a"/>
      <stop offset="1" stop-color="#6b7248"/>
    </linearGradient>
    <linearGradient id="chain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9dcb8"/>
      <stop offset="1" stop-color="#8a9060"/>
    </linearGradient>
  </defs>
  <!-- chain strands, drawn first so tags cover the ends -->
  <path d="M 12 6 C 14 18, 18 26, 24 32" fill="none" stroke="url(#chain)" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 12 6 C 14 18, 18 26, 24 32" fill="none" stroke="#3b3f22" stroke-width="0.9" stroke-linecap="round"/>
  <path d="M 52 6 C 50 18, 46 26, 40 30" fill="none" stroke="url(#chain)" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 52 6 C 50 18, 46 26, 40 30" fill="none" stroke="#3b3f22" stroke-width="0.9" stroke-linecap="round"/>
  <!-- back tag -->
  <g transform="rotate(8 40 38)">
    <rect x="30" y="24" width="18" height="30" rx="4" fill="url(#metal)" stroke="#2d301a" stroke-width="1.5"/>
    <circle cx="39" cy="28" r="1.6" fill="#2d301a"/>
  </g>
  <!-- front tag -->
  <g transform="rotate(-6 24 40)">
    <rect x="15" y="26" width="20" height="32" rx="4" fill="url(#metal)" stroke="#2d301a" stroke-width="1.5"/>
    <circle cx="25" cy="30" r="1.6" fill="#2d301a"/>
    <line x1="19" y1="38" x2="31" y2="38" stroke="#3b3f22" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="19" y1="43" x2="31" y2="43" stroke="#3b3f22" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="19" y1="48" x2="28" y2="48" stroke="#3b3f22" stroke-width="1.2" stroke-linecap="round"/>
  </g>
</svg>